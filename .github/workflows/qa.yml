{
  "name": "Local QA",
  "on": {
    "push": {
      "branches": [
        "main"
      ]
    },
    "pull_request": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "qa-${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "qa": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "steps": [
        {
          "name": "Check out repository",
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Use Node.js 20",
          "uses": "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38",
          "with": {
            "node-version": 20,
            "cache": "npm"
          }
        },
        {
          "name": "Verify inert install policy",
          "run": "test \"$(npm config get ignore-scripts)\" = \"true\""
        },
        {
          "name": "Install locked dependencies",
          "run": "npm ci"
        },
        {
          "name": "Test Forge evidence producer contract",
          "run": "python3 -B -m unittest discover -s tests -p 'test_forge_verification.py' -v"
        },
        {
          "name": "Run local QA gate and emit commit-bound evidence",
          "run": "set +e\npython3 -B scripts/run_forge_verification.py --output \"$RUNNER_TEMP/aift-forge-verification.json\"\nstatus=$?\nif [ \"$status\" -eq 0 ] || [ \"$status\" -eq 1 ]; then\n  echo \"record_published=true\" >> \"$GITHUB_OUTPUT\"\nfi\nexit \"$status\"",
          "id": "forge_verification"
        },
        {
          "name": "Upload Forge verification evidence",
          "if": "${{ always() && steps.forge_verification.outputs.record_published == 'true' }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "aift-forge-verification",
            "path": "${{ runner.temp }}/aift-forge-verification.json",
            "if-no-files-found": "warn",
            "retention-days": 7
          }
        },
        {
          "name": "Verify clean checkout",
          "run": "test -z \"$(git status --porcelain)\""
        }
      ]
    }
  }
}
