name: Embodied Frontier E1 mock-only Python verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiments/embodied-frontier/e1/**'
      - '.github/workflows/embodied-frontier-e1.yml'
  push:
    branches:
      - main
      - frontier/e2-mock-safety-hardening-20261122
    paths:
      - 'experiments/embodied-frontier/e1/**'
      - '.github/workflows/embodied-frontier-e1.yml'
permissions:
  contents: read
jobs:
  mock-only-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact checkout and run E1/E2 tests
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain)"
          printf 'Verified exact checkout: %s\n' "$EXPECTED_HEAD_SHA"
          python --version
          cd experiments/embodied-frontier/e1
          python -m unittest discover -p 'test_*.py' -v
