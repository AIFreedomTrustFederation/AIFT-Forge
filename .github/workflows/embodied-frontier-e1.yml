name: Embodied Frontier E1 mock-only Python verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiments/embodied-frontier/e1/**'
      - '.github/workflows/embodied-frontier-e1.yml'
  push:
    branches:
      - main
    paths:
      - 'experiments/embodied-frontier/e1/**'
      - '.github/workflows/embodied-frontier-e1.yml'
permissions:
  contents: read
jobs:
  mock-only-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Record checkout SHA and run all E1 mock-only tests
        shell: bash
        run: |
          set -euo pipefail
          echo "checkout_sha=$(git rev-parse HEAD)"
          python --version
          cd experiments/embodied-frontier/e1
          python -m unittest discover -p 'test_*.py' -v
